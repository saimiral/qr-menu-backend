version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: qrmenu-postgres
    restart: always
    environment:
      POSTGRES_DB: qrmenu
      POSTGRES_USER: qruser
      POSTGRES_PASSWORD: qrpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: